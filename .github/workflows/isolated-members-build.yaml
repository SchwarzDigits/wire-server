name: Build (isolated members)

# Compile check for the isolatedMembers branch on a fork. The private
# wire-server-enterprise submodule is not accessible here, so it is removed
# from the build before evaluating the nix environment.

on:
  push:
    branches:
      - feature/isolated-team-members
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft /opt/google
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout public submodules
        run: git submodule update --init libs/wire-message-proto-lens/generic-message-proto

      - name: Drop the private enterprise package
        run: |
          git config -f .gitmodules --remove-section submodule.services/wire-server-enterprise
          git add .gitmodules
          git rm --cached -q services/wire-server-enterprise
          sed -i '/wire-server-enterprise/d' nix/local-haskell-packages.nix nix/wire-server.nix
          sed -i '/services\/wire-server-enterprise/d' cabal.project
          sed -i '/^package wire-server-enterprise$/,+1d' cabal.project
          git add .gitmodules nix cabal.project
          git diff --cached --stat

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use the wire-server binary cache
        uses: cachix/cachix-action@v16
        with:
          name: wire-server

      - name: Build the development environment
        run: nix build '.#wireServer.devEnv' --out-link ./.env -L --fallback

      - name: Build the changed packages
        run: |
          export PATH="$PWD/.env/bin:$PATH"
          export PKG_CONFIG_PATH="$PWD/.env/lib/pkgconfig"
          export LIBRARY_PATH="$PWD/.env/lib"
          export LC_ALL=C.UTF-8
          cp hack/cabal.project.local.template cabal.project.local
          cabal update
          df -h /
          set -o pipefail
          cabal build -j2 wire-api wire-subsystems galley brig stern integration 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
